name: Jira — Move to QA on PR merge

on:
  pull_request:
    types: [closed]

jobs:
  transition:
    # Only run when the PR was actually merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Extract Jira ticket keys from PR title
        id: keys
        run: |
          # Match every PRAG-NNN in the PR title (handles "PRAG-15+PRAG-16" style too)
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "PR title: $PR_TITLE"

          KEYS=$(echo "$PR_TITLE" | grep -oE 'PRAG-[0-9]+' | sort -u | tr '\n' ' ')
          echo "Extracted keys: $KEYS"
          echo "keys=$KEYS" >> "$GITHUB_OUTPUT"

      - name: Transition tickets to QA and add comment
        if: steps.keys.outputs.keys != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          AUTH=$(echo -n "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" | base64)

          for KEY in ${{ steps.keys.outputs.keys }}; do
            echo "── Processing $KEY ──"

            # 1. Transition to QA (transition id 3)
            STATUS=$(curl -s -o /tmp/transition_response.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Basic $AUTH" \
              -H "Content-Type: application/json" \
              -d '{"transition": {"id": "3"}}' \
              "$JIRA_BASE_URL/rest/api/3/issue/$KEY/transitions")

            echo "$KEY transition HTTP $STATUS"
            if [ "$STATUS" != "204" ]; then
              echo "⚠️  Unexpected status for transition: $STATUS"
              cat /tmp/transition_response.json
            fi

            # 2. Post a comment linking to the merged PR
            COMMENT_BODY=$(jq -n \
              --arg pr_url "$PR_URL" \
              --arg pr_title "$PR_TITLE" \
              '{
                body: {
                  type: "doc",
                  version: 1,
                  content: [{
                    type: "paragraph",
                    content: [
                      { type: "text", text: "✅ PR merged and ticket moved to QA automatically. " },
                      { type: "text", text: ($pr_title + " → "), marks: [{ type: "strong" }] },
                      { type: "text", text: $pr_url, marks: [{ type: "link", attrs: { href: $pr_url } }] }
                    ]
                  }]
                }
              }')

            COMMENT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              -H "Authorization: Basic $AUTH" \
              -H "Content-Type: application/json" \
              -d "$COMMENT_BODY" \
              "$JIRA_BASE_URL/rest/api/3/issue/$KEY/comment")

            echo "$KEY comment HTTP $COMMENT_STATUS"
          done

      - name: No Jira keys found
        if: steps.keys.outputs.keys == ''
        run: echo "No PRAG-NNN keys found in PR title — nothing to transition."
